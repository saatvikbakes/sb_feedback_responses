<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live Feedback Carousel</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.carousel-container {
  width: 90%;
  max-width: 600px;
  text-align: center;
}

.card {
  padding: 30px;
  font-size: 20px;
  border-radius: 12px;
  background: #f7f7f7;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  opacity: 0;
  transition: opacity 1s ease-in-out;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.card.show {
  opacity: 1;
}

.name {
  font-size: 26px;
  font-weight: bold;
  margin-bottom: 10px;
}

.stars {
  font-size: 24px;
  color: #ffb400;
  margin-bottom: 10px;
}

.product {
  font-size: 18px;
  margin-bottom: 10px;
  color: #555;
}

.feedback {
  font-size: 18px;
  color: #333;
  max-width: 90%;
}
</style>
</head>

<body>

<div class="carousel-container">
  <div id="card" class="card">Loading feedback...</div>
</div>

<script>
const FEED_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRP8iz3kN2w7iTpVv6M_jiJsFyvnv4EzoMGaRkLi1BzgPIdEunP875mKv6ts79tLf_QWQYVY4f4OjJR/pub?output=csv";

let feedbackList = [];
let currentIndex = 0;

function makeStars(num) {
  return "⭐".repeat(parseInt(num));
}

async function loadFeedback() {
  const res = await fetch(FEED_URL);
  const text = await res.text();
  const rows = text.split("\n").filter(r => r.trim() !== "");

  // Skip header row
  const dataRows = rows.slice(1);

  feedbackList = dataRows.map(row => {
    const cols = row.split(",");

    return {
      name: cols[0] || "",
      rating: cols[1] || "",
      product: cols[2] || "",
      flavor: cols[3] || "",
      feedback: cols[4] || ""
    };
  });
}

function showNextCard() {
  const card = document.getElementById("card");

  if (feedbackList.length === 0) {
    card.innerHTML = "No feedback yet...";
    return;
  }

  const item = feedbackList[currentIndex];

  const stars = makeStars(item.rating);

  const html = `
    <div class="name">${item.name}</div>
    <div class="stars">${stars}</div>
    <div class="product">${item.product} – ${item.flavor}</div>
    <div class="feedback">${item.feedback}</div>
  `;

  card.classList.remove("show");

  setTimeout(() => {
    card.innerHTML = html;
    card.classList.add("show");
    currentIndex = (currentIndex + 1) % feedbackList.length;
  }, 500);
}

async function startCarousel() {
  await loadFeedback();
  showNextCard();
  setInterval(showNextCard, 15000); // 15 seconds per card
  setInterval(loadFeedback, 30000); // refresh data every 30 seconds
}

startCarousel();
</script>

</body>
</html>
